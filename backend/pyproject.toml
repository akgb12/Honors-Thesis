[project]
name = "honors-thesis-backend"
version = "0.1.0"
description = "Django API for accessibility remediation projects"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a11y-pipeline",
    "django>=6,<7",
    "django-cors-headers",
    "django-ninja",
    "django-tasks-db==0.13.0",
    "dj-database-url",
    "psycopg[binary]",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest-django",
]

[tool.uv.sources]
a11y-pipeline = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "projects"]
